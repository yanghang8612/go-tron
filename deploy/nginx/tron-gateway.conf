upstream java_mainnet   { server 127.0.0.1:8088; keepalive 16; }
upstream java_nile      { server 127.0.0.1:9999; keepalive 16; }
upstream gtron_main     { server 127.0.0.1:8090; keepalive 16; }
upstream gtron_main_rpc { server 127.0.0.1:8545; keepalive 16; }
upstream gtron_main_pprof { server 127.0.0.1:6062; keepalive 4; }
upstream gtron_main_snapshots { server 127.0.0.1:6072; keepalive 8; }
upstream gtron_nile     { server 127.0.0.1:8091; keepalive 16; }
upstream gtron_nile_rpc { server 127.0.0.1:8546; keepalive 16; }
upstream gtron_nile_pprof { server 127.0.0.1:6061; keepalive 4; }

server {
    listen 6060;
    server_name _;
    server_tokens off;

    client_max_body_size 16m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location /jm/  { proxy_pass http://java_mainnet/; }
    location /jn/  { proxy_pass http://java_nile/; }
    location /gm/  { proxy_pass http://gtron_main/; }
    location /gmr/ { proxy_pass http://gtron_main_rpc/; }
    location /gr/  { proxy_pass http://gtron_main_rpc/; }
    location /gn/  { proxy_pass http://gtron_nile/; }
    location /gnr/ { proxy_pass http://gtron_nile_rpc/; }

    # Internal operator sampling endpoints. The pprof servers themselves stay
    # loopback-only; this gateway must remain restricted to the company network.
    location /debug/ {
        proxy_pass http://gtron_main_pprof;
        proxy_read_timeout 360s;
    }

    location /debug-nile/ {
        rewrite ^/debug-nile/(.*)$ /debug/$1 break;
        proxy_pass http://gtron_nile_pprof;
        proxy_read_timeout 360s;
    }

    # Signed immutable snapshot generations. The gtron listener itself is
    # loopback-only and serves no directory listings or unpublished files.
    # Range is preserved for resumable bootstrap downloads.
    location /snapshots/ {
        proxy_pass http://gtron_main_snapshots/;
        proxy_buffering off;
        proxy_force_ranges on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = / {
        default_type text/plain;
        return 200 "tron-gateway
  /jm/   java mainnet HTTP :8088
  /jn/   java nile HTTP :9999
  /gm/   gtron main HTTP :8090
  /gmr/  gtron main JSON-RPC :8545
  /gr/   gtron main JSON-RPC :8545
  /gn/   gtron nile HTTP :8091
  /gnr/  gtron nile JSON-RPC :8546
  /debug/pprof/       gtron main pprof :6062
  /debug-nile/pprof/  gtron nile pprof :6061
  /snapshots/         signed gtron mainnet snapshots :6072
";
    }
}
