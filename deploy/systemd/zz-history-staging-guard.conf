[Service]
# Install a root-owned copy of the guard and its pinned state before enabling
# this drop-in. The guard rejects old readers after history moves to staging,
# and rejects every service start during MIGRATION_IN_PROGRESS.
# Run the startup checks as root so they can read the private migration journal.
# ExecStart retains the service's java-tron User/Group. This setting requires
# that any additional service hooks be reviewed for root execution.
PermissionsStartOnly=true
ExecStartPre=/usr/bin/python3 /usr/local/libexec/gtron-history-staging-guard.py check-service
